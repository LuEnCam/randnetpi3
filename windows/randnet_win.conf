# randnet_win configuration - the Windows version of randnetpi3.conf
#
#   python randnet_win.py --config randnet_win.conf --dry-run
#   python randnet_win.py --config randnet_win.conf
#
# Anything left out takes the built-in default. Section and key names match
# randnetpi3.conf where the setting means the same thing.

[modem]

# COM port of the modem, e.g. COM3. Empty: the first port whose description
# mentions "modem". `python randnet_win.py --list-ports` shows them all.
device =

speed = 57600

# Pick the modem by USB vendor:product id instead, e.g. 0572:1329.
usb_id =

# The console waits for a dial tone before it dials. "no" sends silence
# instead (for a line simulator that makes its own tone); the modem still
# listens for the console's DTMF digits either way.
dial_tone = yes

# An 8 kHz 8 bit mono WAV to use as the tone. Use dreampi's dial-tone.wav
# (https://github.com/Kazade/dreampi): the tone generated when this is empty
# did not get a console to dial in testing. Relative to this file.
dial_tone_wav =

# The AT+VSM= argument choosing the voice format, and the encoding of the
# audio sent in it. --probe reads the modem's AT+VSM=? list and prints both
# lines to use. 1,8000 (8 bit unsigned PCM) is what randnetpi3 uses and suits
# Conexant/Rockwell chips, USB modems included. Agere softmodems have no 8 bit
# unsigned format; they take 4,8000 (mu-law). voice_encoding = auto follows
# the ITU-T V.253 meaning of the first number (0 16 bit PCM, 1 8 bit
# unsigned, 4 mu-law, 5 A-law); otherwise set u8, s16le, s16be, ulaw or alaw.
voice_sample_mode = 1,8000
voice_encoding = auto

# Extra AT commands sent after every ATZ0/ATE0, one per line. For example a
# softmodem that needs its country set, or blind dialling off:
#   init_commands = AT+GCI=FD
#       AT&C1
init_commands =

# none or rtscts. none matches the Linux version.
flow_control = none

# End the session when the modem's DCD line drops.
use_dcd = yes

# voice: the bridge plays the dial tone and listens for the console's DTMF
# digits, as on Linux. Needs a modem with voice mode (--probe tells you).
# ring: data mode only, for a modem without voice mode. Something on the line
# must play the dial tone and ring this modem when the console dials: a
# telephone line simulator, not a plain line voltage inducer. The bridge
# answers after answer_rings rings.
answer_mode = voice
answer_rings = 1

answer_delay = 8.0
post_answer_delay = 5.0
reconnect_delay = 5.0


[ppp]

# The two ends of the PPP link. These never appear on your LAN: the console's
# traffic leaves this PC from the PC's own address, so unlike the Linux
# version there is no need to find free addresses in your subnet. Change them
# only if 192.168.164.0/24 is a real network you need the console to reach.
local_ip = 192.168.164.1
peer_ip = 192.168.164.2

# The key from your disk. extract_member.py reads it from a .ndd image,
# randnet_diskread.n64 from a physical disk.
chap_client = *
chap_name = Randnet
chap_secret = K1QU0K@N

# Alternative to chap_secret for keys with awkward characters.
chap_secret_b64 =

# DNS server given to the console. Empty: local_ip, which is answered here.
ms_dns =

lcp_echo_interval = 30
lcp_echo_failure = 4


[network]

# Where the Randnet names point: host (this PC), an IPv4 address, a hostname
# (resolved at start), or off.
randnet_redirect = dd.randnetdd.ch

randnet_domain = randnet.ne.jp

randnet_hostnames = randnet.ne.jp, www.randnet.ne.jp, peach.randnet.ne.jp,
    dd.randnet.ne.jp, smtp.dd.randnet.ne.jp, pop.dd.randnet.ne.jp

# The disk's hard-coded DNS servers. Queries to them are answered here.
dns_redirect = 172.16.10.30, 172.16.10.31

# A DNS server to forward other queries to, e.g. 1.1.1.1. Empty: use the PC's
# own resolver, which follows Windows' settings and hosts file but can only
# answer address (A) lookups.
upstream_dns =

# The disk's hard-coded HTTP proxies, sent to the browsing proxy below.
proxy_hosts = 172.16.10.40:8080, 172.16.10.41:8080, 172.116.10.40:8080, 172.116.10.41:8081
proxy_target_port = 8080

# Send the console's other port 80 traffic through the browsing proxy too.
transparent_http = yes
transparent_http_port = 8080

# Wrap the console's port 80 traffic to the Randnet server in TLS. Done in
# this process; no stunnel. The server's certificate is checked against the
# Windows certificate store.
randnet_tls = yes
randnet_tls_host =
randnet_tls_port = 443

# Extra CA certificates (a PEM bundle such as curl's cacert.pem), trusted on
# top of the Windows store by the tunnel and the proxy. Only needed when the
# Windows store is out of date. Relative paths are relative to this file.
ca_file =


[proxy]

# The browsing proxy is randnet_proxy.py from the folder above, run inside
# this process and listening on loopback only.
enabled = yes
port = 8080
max_bytes = 32768
timeout = 20
preserve_agent_for = randnet.ne.jp
user_agent =
rewrite_https = yes
http_first = no
insecure = no
